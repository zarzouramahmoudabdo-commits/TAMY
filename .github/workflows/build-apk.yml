name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['www/**', '*.md']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate icons
        run: |
          sudo apt-get install -y fonts-dejavu-core
          pip install pillow
          python tools/make_icons.py .

      - name: Install dependencies
        run: npm install

      - name: Point the app at the GitHub Pages site
        run: node tools/set-url.js "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Create Android project
        run: npx cap add android

      - name: Generate launcher icons
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0b5d3b' --iconBackgroundColorDark '#073d27'

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TAMY.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TAMY-apk
          path: TAMY.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: TAMY — أحدث نسخة APK
          body: حمّل الملف TAMY.apk وثبّته على جهازك الأندرويد.
          files: TAMY.apk
