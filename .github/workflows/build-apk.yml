name: Build TAMY APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Copy fonts
        run: npm run fonts

      - name: Prepare and validate Quran text
        run: npm run quran

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Generate launcher icons and splash
        run: npm run assets

      - name: Write app version
        run: |
          L=$(cat native-level.txt 2>/dev/null || echo 1)
          echo "NLEVEL=$L" >> "$GITHUB_ENV"
          echo "{\"build\":${{ github.run_number }},\"level\":$L}" > www/version.json

      - name: Restore signing key
        run: |
          echo "${{ secrets.TAMY_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/tamy.jks"
          echo "TAMY_KEYSTORE_PATH=$RUNNER_TEMP/tamy.jks" >> "$GITHUB_ENV"
          echo "TAMY_KEY_PASS=${{ secrets.TAMY_KEY_PASS }}" >> "$GITHUB_ENV"
      - name: Sync and patch Android project
        run: npm run sync
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}.${{ env.NLEVEL }}

      - name: Pack live update bundle
        run: |
          cd android/app/src/main/assets/public
          zip -qr "$GITHUB_WORKSPACE/www_l${NLEVEL}.zip" .
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TAMY.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TAMY-apk
          path: TAMY.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TAMY build ${{ github.run_number }}
          files: |
            TAMY.apk
            www_l${{ env.NLEVEL }}.zip
