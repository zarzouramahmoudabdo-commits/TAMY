<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#062b24"><title>TAMY</title>
<style>
html,body{margin:0;height:100%;background:#062b24;color:#f3ead2;font-family:system-ui,sans-serif}
body{display:grid;place-items:center;padding:24px;box-sizing:border-box;background:radial-gradient(120% 80% at 50% 0%,#0d3f33,#062b24 70%)}
.b{max-width:380px;text-align:center}
.i{width:84px;height:84px;margin:0 auto 18px;border-radius:26px;display:grid;place-items:center;font-size:40px;background:rgba(230,191,99,.14);border:1px solid rgba(230,191,99,.4)}
h1{font-size:22px;margin:0 0 12px;color:#e6bf63}
p{margin:0 0 22px;line-height:2;opacity:.85;font-size:15.5px}
button{display:block;width:100%;margin:8px 0;padding:13px;border-radius:16px;font:inherit;font-weight:700;font-size:16px;border:0;background:linear-gradient(135deg,#f0d588,#c9a24b);color:#1a1305}
small{display:block;margin-top:14px;opacity:.55}
</style></head><body><div class="b">
<div class="i">☪</div>
<h1>أهلًا بك في TAMY</h1>
<p>في أول استخدام فقط يحتاج التطبيق إلى اتصال بالإنترنت ليجهّز نفسه. بعد ذلك يعمل بدون إنترنت بشكل طبيعي بإذن الله.</p>
<button id="retry">إعادة المحاولة</button>
<small>سيُعاد الاتصال تلقائيًا عند توفر الإنترنت</small>
</div>
<script>
var URLX='https://zarzouramahmoudabdo-commits.github.io/TAMY/';
function go(){ location.replace(URLX); }
document.getElementById('retry').onclick=go;
window.addEventListener('online',function(){ setTimeout(go,800); });
setInterval(function(){ if(navigator.onLine){ fetch(URLX,{mode:'no-cors',cache:'no-store'}).then(go,function(){}); } },6000);
</script></body></html>
